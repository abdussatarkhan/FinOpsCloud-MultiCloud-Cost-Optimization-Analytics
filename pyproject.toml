[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finopscloud_multicloud_cost_optimization_analytics"
version = "1.0.0"
description = "Enterprise Multi-Cloud (AWS/GCP/Azure) FinOps Data Warehouse: Unit economics per API transaction, Kubernetes pod rightsizing, RI/Savings Plan coverage, and unattached resource waste."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
